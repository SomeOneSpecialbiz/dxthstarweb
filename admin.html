<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS Library & Initialization -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://orpzbfiwfsbzimjearrl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ycHpiZml3ZnNiemltamVhcnJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTU1NTcsImV4cCI6MjEwNDk5MTU1N30.LivGWLkG7n0PAfrIZkl77fNm0O22nQ-zjxm-RYY8md8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', Arial, sans-serif;
        }

        body {
            background-color: #010101;
            color: #333;
        }

        /* Password Modal Styling */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .login-box {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            margin-bottom: 15px;
        }

        .login-box input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }

        .btn-login {
            width: 100%;
            padding: 10px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        /* Admin Layout Styling */
        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 3px;
        }

        .btn-edit {
            background: #ffc107;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 3px;
        }

        .btn-archive {
            background: #6c757d;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 3px;
        }

        .archived-row {
            opacity: 0.5;
            background-color: #f8f9fa;
        }

        .error-msg {
            color: red;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

    <!-- PASSWORD LOGIN OVERLAY -->
    <div id="login-overlay">
        <div class="login-box">
            <h2>Admin Login</h2>
            <p>Enter the password to access incoming orders.</p>
            <input type="password" id="admin-pass" placeholder="Password">
            <p id="error-msg" class="error-msg">Incorrect password. Try again.</p>
            <button class="btn-login" onclick="checkPassword()">Access Dashboard</button>
        </div>
    </div>

    <!-- MAIN ADMIN DASHBOARD CONTENT -->
    <div id="admin-dashboard" class="admin-container">
        <h2>Business Admin Dashboard - Incoming Orders</h2>
        <p>View, edit, archive, or delete customer orders submitted from the main store.</p>

        <table>
            <thead>
                <tr>
                    <th>Order Ref #</th>
                    <th>Customer Name</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>Items Bought</th>
                    <th>Total Cost</th>
                    <th>Status / Actions</th>
                </tr>
            </thead>
            <tbody id="orders-table-body">
                <!-- Dynamic Row Insertion -->
            </tbody>
        </table>
    </div>

    <script>
        const ADMIN_PASSWORD = "123456";
        let orders = [];

        function checkPassword() {
            const enteredPass = document.getElementById('admin-pass').value;
            const errorMsg = document.getElementById('error-msg');

            if (enteredPass === ADMIN_PASSWORD) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('admin-dashboard').style.display = 'block';
                loadOrders();
            } else {
                errorMsg.style.display = 'block';
            }
        }

        async function loadOrders() {
            const { data, error } = await supabaseClient
                .from('orders')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Error fetching orders:", error);
                return;
            }

            orders = data || [];
            renderAdminTable();
        }

        function renderAdminTable() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '';

            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No orders placed yet.</td></tr>';
                return;
            }

            orders.forEach(order => {
                const tr = document.createElement('tr');
                if (order.archived) tr.classList.add('archived-row');

                let itemNames = 'N/A';
                if (Array.isArray(order.items)) {
                    itemNames = order.items.map(i => i.name).join(', ');
                } else if (typeof order.items === 'string') {
                    itemNames = order.items;
                }

                const totalCost = typeof order.total_amount === 'number' ? order.total_amount.toFixed(2) : '0.00';

                tr.innerHTML = `
                    <td><strong>#${order.ref}</strong></td>
                    <td>${order.name}</td>
                    <td>${order.email}</td>
                    <td>${order.address || 'N/A'}</td>
                    <td>${itemNames}</td>
                    <td>R ${totalCost}</td>
                    <td>
                        <button class="btn-edit" onclick="editOrder(${order.id})">Edit</button>
                        <button class="btn-archive" onclick="toggleArchiveOrder(${order.id})">${order.archived ? 'Unarchive' : 'Archive'}</button>
                        <button class="btn-danger" onclick="deleteOrder(${order.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function editOrder(id) {
            const order = orders.find(o => o.id === id);
            if (!order) return;

            const newName = prompt("Edit Customer Name:", order.name);
            const newEmail = prompt("Edit Customer Email:", order.email);
            const newAddress = prompt("Edit Customer Address:", order.address || '');

            if (newName === null && newEmail === null && newAddress === null) return;

            const { error } = await supabaseClient
                .from('orders')
                .update({
                    name: newName !== null ? newName : order.name,
                    email: newEmail !== null ? newEmail : order.email,
                    address: newAddress !== null ? newAddress : order.address
                })
                .eq('id', id);

            if (error) {
                alert("Error updating order.");
                console.error(error);
            } else {
                loadOrders();
            }
        }

        async function toggleArchiveOrder(id) {
            const order = orders.find(o => o.id === id);
            if (!order) return;

            const { error } = await supabaseClient
                .from('orders')
                .update({ archived: !order.archived })
                .eq('id', id);

            if (error) {
                alert("Error archiving order.");
                console.error(error);
            } else {
                loadOrders();
            }
        }

        async function deleteOrder(id) {
            if (confirm("Are you sure you want to delete this order?")) {
                const { error } = await supabaseClient
                    .from('orders')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Error deleting order.");
                    console.error(error);
                } else {
                    loadOrders();
                }
            }
        }
    </script>
</body>
</html>
