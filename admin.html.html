<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', Arial, sans-serif; }
        body { background-color: #010101; color: #333; }
        
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #111; display: flex; justify-content: center; align-items: center; z-index: 999;
        }
        .login-box {
            background: #fff; padding: 30px; border-radius: 8px; text-align: center; width: 90%; max-width: 350px;
        }
        .login-box input {
            width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px;
        }
        .btn-login {
            width: 100%; padding: 10px; background: #111; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;
        }
        
        .admin-container {
            max-width: 1100px; margin: 40px auto; padding: 20px; background: #fff; border-radius: 8px; display: none;
        }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-logout { background: #333; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table, th, td { border: 1px solid #ddd; }
        th, td { padding: 12px; text-align: left; }
        th { background-color: #f2f2f2; }
        
        .btn-danger { background: #dc3545; color: white; border: none; padding: 6px 12px; cursor: pointer; border-radius: 3px; }
        .btn-edit { background: #ffc107; border: none; padding: 6px 12px; cursor: pointer; border-radius: 3px; }
        .error-msg { color: red; font-size: 0.9rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION OVERLAY -->
    <div id="login-overlay">
        <form class="login-box" onsubmit="handleLogin(event)">
            <h2>Admin Login</h2>
            <p style="margin-bottom: 10px; font-size: 0.85rem; color: #666;">Enter authorized credentials</p>
            <input type="email" id="admin-email" placeholder="Admin Email" required>
            <input type="password" id="admin-pass" placeholder="Password" required>
            <p id="error-msg" class="error-msg"></p>
            <button type="submit" class="btn-login">Access Dashboard</button>
        </form>
    </div>

    <!-- DASHBOARD CONTENT -->
    <div id="admin-dashboard" class="admin-container">
        <div class="header-bar">
            <h2>Business Admin Dashboard - Orders</h2>
            <button class="btn-logout" onclick="handleLogout()">Sign Out</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Ref #</th>
                    <th>Customer Name</th>
                    <th>Email</th>
                    <th>Address</th>
                    <th>Items</th>
                    <th>Total Cost</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="orders-table-body">
                <tr><td colspan="7" style="text-align:center;">Loading orders...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const SUPABASE_URL = 'https://orpzbfiwfsbzimjearrl.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ycHpiZml3ZnNiemltamVhcnJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTU1NTcsImV4cCI6MjEwNDk5MTU1N30.LivGWLkG7n0PAfrIZkl77fNm0O22nQ-zjxm-RYY8md8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check active session on page load
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showDashboard();
            }
        });

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-pass').value;
            const errorMsg = document.getElementById('error-msg');

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorMsg.innerText = error.message;
                errorMsg.style.display = 'block';
            } else {
                errorMsg.style.display = 'none';
                showDashboard();
            }
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            document.getElementById('admin-dashboard').style.display = 'none';
            document.getElementById('login-overlay').style.display = 'flex';
        }

        function showDashboard() {
            document.getElementById('login-overlay').style.display = 'none';
            document.getElementById('admin-dashboard').style.display = 'block';
            loadOrders();
        }

        async function loadOrders() {
            const { data: orders, error } = await supabaseClient
                .from('orders')
                .select('*')
                .order('id', { ascending: false });

            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '';

            if (error) {
                tbody.innerHTML = `<tr><td colspan="7" style="color:red; text-align:center;">Failed to fetch orders: ${error.message}</td></tr>`;
                return;
            }

            if (!orders || orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No orders found.</td></tr>';
                return;
            }

            orders.forEach(order => {
                const tr = document.createElement('tr');
                const itemList = Array.isArray(order.items) 
                    ? order.items.map(i => i.name).join(', ') 
                    : 'No items';

                tr.innerHTML = `
                    <td><strong>#${order.ref}</strong></td>
                    <td>${order.name}</td>
                    <td>${order.email}</td>
                    <td>${order.address || 'N/A'}</td>
                    <td>${itemList}</td>
                    <td>R ${Number(order.total_amount || 0).toFixed(2)}</td>
                    <td>
                        <button class="btn-edit" onclick="editOrder(${order.id}, '${order.name}', '${order.email}', '${order.address}')">Edit</button>
                        <button class="btn-danger" onclick="deleteOrder(${order.id})">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function editOrder(id, currentName, currentEmail, currentAddress) {
            const newName = prompt("Edit Customer Name:", currentName);
            const newEmail = prompt("Edit Customer Email:", currentEmail);
            const newAddress = prompt("Edit Customer Address:", currentAddress);

            if (newName === null && newEmail === null && newAddress === null) return;

            const { error } = await supabaseClient
                .from('orders')
                .update({ 
                    name: newName || currentName, 
                    email: newEmail || currentEmail, 
                    address: newAddress || currentAddress 
                })
                .eq('id', id);

            if (error) {
                alert('Update failed: ' + error.message);
            } else {
                loadOrders();
            }
        }

        async function deleteOrder(id) {
            if (confirm("Are you sure you want to permanently delete this order?")) {
                const { error } = await supabaseClient
                    .from('orders')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert('Delete failed: ' + error.message);
                } else {
                    loadOrders();
                }
            }
        }
    </script>
</body>
</html>
